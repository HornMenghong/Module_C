<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d6efd">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./bootstrap.css">
  <title>Lyon Web Services</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    header,
    nav {
      flex-shrink: 0;
    }

    main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    main::-webkit-scrollbar {
      display: none;
    }

    .weather-row {
      position: absolute;
      top: 50%;
      transform: translate(0, -50%);
      display: flex;
      flex-direction: row;
      gap: 15px;
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      padding: 5px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
    }

    .weather-row::-webkit-scrollbar {
      display: none;
    }

    .weather-card {
      flex: 0 0 auto;
      width: 140px;
      text-align: center;
      scroll-snap-align: center;
    }

    .weather-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 200px;
    }

    .weather-icon svg {
      width: 50%;
      height: 50%;
      transform: scale(3);
    }

    .weather-icon path {
      fill: none;
      stroke: #1c3e60;
      stroke-width: 1;
      transition: 0.3s ease;
    }

    .weather-icon:hover path {
      stroke-dasharray: 50;
      stroke-dashoffset: 200;
      animation: strokeEffect 2s linear infinite;
    }

    @keyframes strokeEffect {
      to {
        stroke-dasharray: 200;
        stroke-dashoffset: 0;
      }
    }

    .card {
      width: 95%;
      max-width: 500px;
    }

    .event-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
    }

    .travel-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    dialog {
      border: none;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .pin-btn {
      min-width: 70px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-control {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .nav-btn.active {
      opacity: 0.8;
      font-weight: bold;
    }
  </style>
</head>

<body class="bg-light">

  <header class="d-flex justify-content-between align-items-center p-2 bg-primary text-white">
    <h1 id="header-title" class="h5 m-0">Mobile Web Service</h1>
  </header>

  <main id="content"></main>

  <nav class="d-flex justify-content-between align-items-center p-2 bg-primary text-white">
    <button class="btn btn-primary nav-btn" data-view="carparks">Carparks</button>
    <button class="btn btn-primary nav-btn" data-view="events">Events</button>
    <button class="btn btn-primary nav-btn" data-view="weather">Weather</button>
    <button class="btn btn-primary nav-btn" data-view="travel">Travel</button>
    <button class="btn btn-primary nav-btn" data-view="settings">Settings</button>
  </nav>

  <dialog id="modal">
    <div id="modal-content"></div>
    <div class="d-flex justify-content-end mt-3">
      <button id="modal-close-btn" class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  </dialog>

  <template id="carpark-sort-template">
    <h6>Sort Carparks</h6>
    <div class="d-grid gap-2 mt-3">
      <button class="btn btn-primary" onclick="sortCarparks('alpha')">A - Z</button>
      <button class="btn btn-primary" onclick="sortCarparks('alpha-reverse')">Z - A</button>
      <button class="btn btn-primary" onclick="sortCarparks('distance')">Closest First</button>
      <button class="btn btn-primary" onclick="sortCarparks('distance-reverse')">Farthest First</button>
    </div>
  </template>

  <template id="travel-form-template">
    <h2 id="travel-form-title">Add Travel Plan</h2>

    <div class="form-group">
      <label>Image</label>
      <input type="file" id="travelImage" accept="image/*" class="form-control">
    </div>

    <div class="form-group">
      <input id="title" type="text" placeholder="Title *" class="form-control" required>
    </div>

    <div class="form-group">
      <input id="place" type="text" placeholder="Place *" class="form-control" required>
    </div>

    <div class="form-group">
      <input id="time" type="time" class="form-control">
    </div>

    <div class="form-group">
      <label class="me-3">
        <input type="radio" name="dayType" value="single" checked>
        Single Day
      </label>

      <label>
        <input type="radio" name="dayType" value="multiple">
        Multiple Days
      </label>
    </div>

    <div class="form-group">
      <input id="startDate" type="date" class="form-control mb-2" required>
      <input id="endDate" type="date" class="form-control d-none">
    </div>

    <button id="travel-save-btn" class="btn btn-success w-100">
      Add Plan
    </button>
  </template>

  <script src="./geolocation_distance.js"></script>
  <script>
    const state = {
      carparks: null,
      weatherData: null,
      currentView: null,
      eventsPage: 1,
      infiniteScroll: false,
      isSorted: false,
      carparkSort: null,
      editPlanId: null,
      userLat: null,
      userLng: null
    };

    function getLocation() {
      const params = new URLSearchParams(window.location.search);

      const latitude = params.get('latitude');
      const longitude = params.get('longitude');

      if (latitude && longitude) {
        state.userLat = parseFloat(latitude);
        state.userLng = parseFloat(longitude);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          state.userLat = position.coords.latitude;
          state.userLng = position.coords.longitude;
        },
        error => {
          console.log('Geolocation error:', error);
        }
      );
    }

    const title = document.getElementById('header-title');
    const content = document.getElementById('content');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    const BASEURL = '/module_d_api.php/';

    async function fetchData(endpoint) {
      try {
        const res = await fetch(BASEURL + endpoint);
        if (!res.ok) throw new Error(res.status);
        return await res.json();
      } catch (e) {
        console.error('Fetch error:', e);
        alert('Failed to load data. Check your connection.');
        return null;
      }
    }

    async function init() {
      getLocation();

      state.carparks = await fetchData('carparks.json');
      state.weatherData = await fetchData('weather.json');

      restoreView();
    }

    // Persistence
    function saveView(view) {
      localStorage.setItem('lastView', view);
    }
    function restoreView() {
      const last = localStorage.getItem('lastView') || 'carparks';
      const btn = document.querySelector(`.nav-btn[data-view="${last}"]`);
      if (btn) btn.click();
      else renderCarparks();
    }

    // LocalStorage helpers
    function getPinned() {
      try { return JSON.parse(localStorage.getItem('pinnedCarparks')) || []; }
      catch { return []; }
    }

    function savePinned(pins) { localStorage.setItem('pinnedCarparks', JSON.stringify(pins)); }

    function getPlans() {
      try { return JSON.parse(localStorage.getItem('plans')) || []; }
      catch { return []; }
    }

    function savePlans(plans) { localStorage.setItem('plans', JSON.stringify(plans)); }

    // Dialog helpers
    function openModal(html) {
      modalContent.innerHTML = html;
      modal.showModal();
    }

    function openModalFromTemplate(templateId) {
      modalContent.innerHTML = '';
      modalContent.appendChild(document.getElementById(templateId).content.cloneNode(true));
      modal.showModal();
    }

    function closeModal() { modal.close(); }

    function cancelTravelDraft() {
      localStorage.removeItem('travelDraft');
      state.editPlanId = null;
      modal.close();
    }

    function getTravelDraft() {
      try {
        return JSON.parse(localStorage.getItem('travelDraft'));
      } catch {
        return null;
      }
    }

    function saveTravelDraft(draft) {
      localStorage.setItem('travelDraft', JSON.stringify(draft));
    }

    function clearTravelDraft() {
      localStorage.removeItem('travelDraft');
    }

    function saveTravelUIState(mode, planId = null) {
      localStorage.setItem('travelUIState', JSON.stringify({
        mode: mode,
        editPlanId: planId
      }));
    }

    function getTravelUIState() {
      try {
        return JSON.parse(localStorage.getItem('travelUIState'));
      } catch {
        return null;
      }
    }

    function clearTravelUIState() {
      localStorage.removeItem('travelUIState');
    }


    modal.addEventListener('click', (e) => {
      const r = modal.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
        modal.close();
      }
    });

    // Navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.view;
        state.infiniteScroll = (view === 'events');
        state.isSorted = false;
        switch (view) {
          case 'carparks': renderCarparks(); break;
          case 'events': renderEvents(); break;
          case 'weather': renderWeathers(); break;
          case 'travel': renderTravels(); break;
          case 'settings': renderSettings(); break;
        }
      });
    });

    // Carparks
    function togglePin(name) {
      const pinned = getPinned();
      const i = pinned.indexOf(name);
      if (i > -1) pinned.splice(i, 1); else pinned.push(name);
      savePinned(pinned);
      renderCarparks();
    }

    function applyPinned(items) {
      const pinned = getPinned();
      return [...items].sort((a, b) => {
        const ap = pinned.includes(a[0]) ? 1 : 0;
        const bp = pinned.includes(b[0]) ? 1 : 0;
        return bp - ap;
      });
    }

    async function viewCarpark(id) {
      if (!state.carparks || !state.carparks[id]) return;
      const cp = state.carparks[id];
      const dist = getDistanceFromLatLonInKm(state.userLat, state.userLng, cp.latitude, cp.longitude);
      content.innerHTML = `
        <div class="card p-3 bg-white">
          <button class="btn btn-primary mb-2" onclick="renderCarparks()">Back</button>
          <h5>${id}</h5>
          <p class="mb-1">Distance: ${dist.toFixed(2)} km</p>
          <p>Available: ${cp.availableSpaces}</p>
        </div>
      `;
    }

    function renderCarparks(sortedData) {
      if (!state.carparks) return;

      title.textContent = 'Carparks';
      state.currentView = 'carparks';
      saveView('carparks');

      let items = Object.entries(state.carparks);

      if (state.carparkSort) {
        const rev = state.carparkSort.endsWith('-reverse') ? -1 : 1;

        if (state.carparkSort.startsWith('alpha')) {
          items.sort((a, b) => rev * a[0].localeCompare(b[0]));
        } else if (state.carparkSort.startsWith('distance')) {
          items.sort((a, b) => {
            const d1 = getDistanceFromLatLonInKm(
              state.userLat,
              state.userLng,
              a[1].latitude,
              a[1].longitude
            );

            const d2 = getDistanceFromLatLonInKm(
              state.userLat,
              state.userLng,
              b[1].latitude,
              b[1].longitude
            );

            return rev * (d1 - d2);
          });
        }
      }

      items = applyPinned(items);

      const pinned = getPinned();

      content.innerHTML = '';

      items.forEach(([name, d]) => {
        const isPinned = pinned.includes(name);

        const el = document.createElement('div');
        el.className = 'card p-3 bg-white mb-2';

        el.innerHTML = `
          <div class="d-flex justify-content-between align-items-start">
            <h6 class="fw-bold mb-1">${name}</h6>
            <button class="btn btn-sm ${isPinned ? 'btn-danger' : 'btn-outline-success'} pin-btn"
              onclick="togglePin('${name}')">
              ${isPinned ? 'Unpin' : 'Pin'}
            </button>
          </div>

          <p class="mb-1">Available: ${d.availableSpaces}</p>
          <p class="mb-2 text-muted small">${d.location}</p>

          <button class="btn btn-primary btn-sm w-100"
            onclick="viewCarpark('${name}')">
            View Details
          </button>
        `;

        content.appendChild(el);
      });
    }

    function sortCarparks(method) {
      state.carparkSort = method;
      closeModal();
    };

    // Events
    async function renderEvents() {
      title.textContent = 'Lyon Events';
      state.currentView = 'events';
      saveView('events');
      state.eventsPage = 1;
      state.isSorted = false;
      content.innerHTML = `
        <div class="card p-3 bg-white w-100 mb-2">
          <div class="d-flex flex-column gap-2">
            <div class="d-flex gap-2">
              <div class="flex-fill">
                <label class="small">Start Date</label>
                <input id="start" type="date" class="form-control"/>
              </div>
              <div class="flex-fill">
                <label class="small">End Date</label>
                <input id="end" type="date" class="form-control"/>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-secondary btn-sm flex-fill" onclick="filterEvents()">Filter</button>
              <button class="btn btn-outline-secondary btn-sm flex-fill" onclick="clearEventFilter()">Clear</button>
            </div>
          </div>
        </div>
      `;
      await loadEvents(1);
    }

    async function loadEvents(page, append = false) {
      let url;

      if (state.isSorted) {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;

        const params = new URLSearchParams();

        if (start) params.set('beginning_date', start);
        if (end) params.set('ending_date', end);

        params.set('page', page);

        url = `events.json?${params.toString()}`;
      } else {
        url = `events.json?page=${page}`;
      }

      const data = await fetchData(url);
      if (!data || !data.events) return;

      if (!append) {
        content.querySelectorAll('.event-card').forEach(e => e.remove());
      }

      data.events.forEach(ev => {
        const el = document.createElement('div');
        el.className = 'card p-3 bg-white mb-2 event-card';

        el.innerHTML = `
          <img src="${ev.image}" alt="${ev.title}" class="event-img mb-2"
              onerror="this.style.display='none'">
          <h6 class="fw-bold mb-1">${ev.title}</h6>
          <p class="mb-0 text-muted small">${ev.date}</p>
        `;

        content.appendChild(el);
      });
    }

    async function filterEvents() {
      const s = document.getElementById('start').value;
      const e = document.getElementById('end').value;
      if (!s && !e) return;
      state.isSorted = true;
      state.eventsPage = 1;
      await loadEvents(1, false);
    }

    async function clearEventFilter() {
      document.getElementById('start').value = '';
      document.getElementById('end').value = '';
      state.isSorted = false;
      state.eventsPage = 1;
      await loadEvents(1, false);
    }

    content.addEventListener('scroll', async () => {
      if (!state.infiniteScroll) return;

      if (content.scrollTop + content.clientHeight >= content.scrollHeight - 100) {
        state.eventsPage++;
        await loadEvents(state.eventsPage, true);
      }
    });

    async function renderWeathers() {
      title.textContent = 'Weather';
      state.currentView = 'weather';
      saveView('weather');
      content.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'weather-row';

      if (!state.weatherData) {
        state.weatherData = await fetchData('weather.json');
      }

      for (const w of state.weatherData || []) {
        const card = document.createElement('div');
        card.className = 'card p-3 weather-card';
        card.innerHTML = `
          <p class="small text-muted mb-2">${w.date}</p>
          <div class="weather-icon"></div>
          <p class="mb-1">${w.lower_temperature}° - ${w.upper_temperature}°C</p>
          <p class="fw-bold small mb-0">${w.status}</p>
        `;
        row.appendChild(card);
      }

      const cards = row.querySelectorAll('.weather-card');
      for (let i = 0; i < cards.length; i++) {
        const w = state.weatherData[i];
        const iconContainer = cards[i].querySelector('.weather-icon');
        try {
          const res = await fetch(`./svn_icons/${w.status}.svg`);
          if (res.ok) iconContainer.innerHTML = await res.text();
        } catch { }
      }

      row.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          row.scrollBy({
            left: e.deltaY,
            behavior: 'smooth'
          });
        }
      }, { passive: false });

      content.appendChild(row);
    }

    // Travel
    function renderTravels() {
      title.textContent = 'Travel Planner';
      state.currentView = 'travel';
      saveView('travel');

      const plans = getPlans();

      content.innerHTML = `
        <div class="w-100 d-flex justify-content-center mb-2">
          <button class="btn btn-secondary" onclick="openTravelForm('create')">
            + Add Plan
          </button>
        </div>
      `;

      plans.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

      if (!plans.length) {
        content.innerHTML += `<p class="text-muted">No travel plans yet.</p>`;
        return;
      }

      plans.forEach(p => {
        const el = document.createElement('div');

        el.id = `travel-plan-${p.id}`;
        el.className = 'card p-3 bg-white mb-2 w-100';
        el.style.marginBottom = "500px";

        el.innerHTML = `
          <p class="text-muted small mb-2">
            ${p.startDate}${p.endDate ? ' - ' + p.endDate : ''}
          </p>

          <div class="d-flex gap-3 align-items-start">
            <img src="${p.image}" class="travel-img">

            <div class="flex-grow-1">
              <h6 class="fw-bold">${p.title}</h6>
              <p class="small mb-1">${p.place}</p>
              <p class="small text-muted">${p.time || ''}</p>

              <button class="btn btn-warning btn-sm"
                onclick="editTravel('${p.id}')">
                Edit
              </button>
            </div>
          </div>
        `;
        content.appendChild(el);
      });

      const today = new Date().toISOString().split('T')[0];
      const upcomingPlan = plans.find(p => p.startDate >= today);

      if (upcomingPlan) {
        const element = document.getElementById(
          `travel-plan-${upcomingPlan.id}`
        );

        if (element) {
          element.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      }

      const uiState = getTravelUIState();

      if (uiState) {
        if (uiState.mode === 'create') {
          openTravelForm('create');
        }

        if (uiState.mode === 'edit' && uiState.editPlanId) {
          const plan = plans.find(p => p.id === uiState.editPlanId);

          if (plan) {
            openTravelForm('edit', plan);
          } else {
            clearTravelUIState();
          }
        }
      }

    }

    function openTravelForm(mode = 'create', plan = null) {
      openModalFromTemplate('travel-form-template');

      const formTitle = document.getElementById('travel-form-title');
      const saveButton = document.getElementById('travel-save-btn');
      const closeButton = document.getElementById('modal-close-btn');

      closeButton.textContent = 'Cancel';
      closeButton.onclick = cancelTravelDraft;

      if (mode === 'edit') {
        formTitle.textContent = 'Edit Travel Plan';
        saveButton.textContent = 'Save Changes';
        state.editPlanId = plan.id;

        saveTravelUIState('edit', plan.id);
      } else {
        formTitle.textContent = 'Add Travel Plan';
        saveButton.textContent = 'Add Plan';
        state.editPlanId = null;

        saveTravelUIState('create');
      }

      saveButton.onclick = mode === 'edit' ? saveEdit : addTravel;

      document.querySelectorAll('input[name="dayType"]').forEach(radio => {
        radio.onchange = toggleEndDate;
      });

      restoreTravelDraft(mode, plan);
      setupTravelDraftListeners();
    }



    function restoreTravelDraft(mode, plan = null) {
      const draft = getTravelDraft();

      // Only restore a draft that belongs to the current mode/edit plan
      if (draft && draft.mode === mode) {
        if (mode === 'create' ||
            (mode === 'edit' && draft.editPlanId === plan?.id)) {

          document.getElementById('title').value = draft.title || '';
          document.getElementById('place').value = draft.place || '';
          document.getElementById('time').value = draft.time || '';
          document.getElementById('startDate').value = draft.startDate || '';
          document.getElementById('endDate').value = draft.endDate || '';

          const dayType = draft.dayType || 'single';
          const radio = document.querySelector(
            `input[name="dayType"][value="${dayType}"]`
          );

          if (radio) {
            radio.checked = true;
          }

          toggleEndDate();
          return;
        }
      }

      // No draft — use existing plan data for edit
      if (mode === 'edit' && plan) {
        document.getElementById('title').value = plan.title || '';
        document.getElementById('place').value = plan.place || '';
        document.getElementById('time').value = plan.time || '';
        document.getElementById('startDate').value = plan.startDate || '';
        document.getElementById('endDate').value = plan.endDate || '';

        const dayType = plan.endDate ? 'multiple' : 'single';

        const radio = document.querySelector(
          `input[name="dayType"][value="${dayType}"]`
        );

        if (radio) {
          radio.checked = true;
        }

        toggleEndDate();
      }
    }


    function setupTravelDraftListeners() {
      const fields = [
        'title',
        'place',
        'time',
        'startDate',
        'endDate'
      ];

      fields.forEach(id => {
        const input = document.getElementById(id);

        input.addEventListener('input', saveCurrentTravelDraft);
        input.addEventListener('change', saveCurrentTravelDraft);
      });

      document.querySelectorAll('input[name="dayType"]').forEach(radio => {
        radio.addEventListener('change', saveCurrentTravelDraft);
      });
    }


    function saveCurrentTravelDraft() {
      const dayType = document.querySelector(
        'input[name="dayType"]:checked'
      )?.value || 'single';

      const draft = {
        mode: state.editPlanId ? 'edit' : 'create',
        editPlanId: state.editPlanId,
        title: document.getElementById('title').value,
        place: document.getElementById('place').value,
        time: document.getElementById('time').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        dayType: dayType
      };

      saveTravelDraft(draft);
    }


    function addTravel() {
      const title = document.getElementById('title').value;
      const place = document.getElementById('place').value;
      const time = document.getElementById('time').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value || null;
      const file = document.getElementById('travelImage').files[0];

      if (!title || !place || !startDate) {
        alert('Please fill in the required fields.');
        return;
      }

      const plans = getPlans();

      const save = (image) => {
        plans.push({
          id: crypto.randomUUID(),
          title,
          place,
          time,
          startDate,
          endDate,
          image
        });

        savePlans(plans);

        // Successful save = remove draft
        clearTravelDraft();

        state.editPlanId = null;

        closeModal();
        renderTravels();
      };

      if (file) {
        const reader = new FileReader();

        reader.onload = function () {
          save(reader.result);
        };

        reader.readAsDataURL(file);
      } else {
        save('');
      }
    }


    function editTravel(id) {
      const plans = getPlans();
      const plan = plans.find(p => p.id === id);

      if (!plan) return;

      openTravelForm('edit', plan);
    }


    function saveEdit() {
      const plans = getPlans();
      const plan = plans.find(p => p.id === state.editPlanId);

      if (!plan) return;

      const title = document.getElementById('title').value;
      const place = document.getElementById('place').value;
      const time = document.getElementById('time').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value || null;

      if (!title || !place || !startDate) {
        alert('Please fill in the required fields.');
        return;
      }

      plan.title = title;
      plan.place = place;
      plan.time = time;
      plan.startDate = startDate;
      plan.endDate = endDate;

      savePlans(plans);

      // Successful save = remove draft
      clearTravelDraft();

      state.editPlanId = null;

      closeModal();
      renderTravels();
    }

    function saveEdit() {
      const plans = getPlans();

      const plan = plans.find(p => p.id === state.editPlanId);

      plan.title = document.getElementById('title').value;
      plan.place = document.getElementById('place').value;
      plan.time = document.getElementById('time').value;
      plan.startDate = document.getElementById('startDate').value;
      plan.endDate = document.getElementById('endDate').value || null;

      savePlans(plans);
      state.editPlanId = null;
      closeModal();
      renderTravels();
    }

    function toggleEndDate() {
      const multi = document.querySelector('input[name="dayType"]:checked').value === 'multiple';
      document.getElementById('endDate').classList.toggle('d-none', !multi);
    }



    // Settings
    function renderSettings() {
      title.textContent = 'Settings';
      state.currentView = 'settings';
      saveView('settings');
      content.innerHTML = `
        <div class="card p-3 bg-white w-100">
          <h6>Appearance</h6>
          <div class="d-grid gap-2 mt-2">
            <button class="btn btn-outline-dark" onclick="setBg('light')">Light Mode</button>
            <button class="btn btn-dark" onclick="setBg('dark')">Dark Mode</button>
            <button class="btn btn-outline-primary" onclick="setBg('system')">System Default</button>
            <h6>Sort Carparks</h6>
            <button class="btn btn-success" onclick="openModalFromTemplate('carpark-sort-template')">Sort & Filter</button>
          </div>
        </div>
        
      `;
    }

    function setBg(mode) {
      if (mode === 'light') {
        document.body.className = 'bg-light';
        document.body.style.backgroundColor = '';
        document.body.style.color = '';
      } else if (mode === 'dark') {
        document.body.className = 'bg-dark';
        document.body.style.backgroundColor = '#1a1a1a';
        document.body.style.color = '#fff';
      } else if (mode === 'system') {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.className = dark ? 'bg-dark' : 'bg-light';
        document.body.style.backgroundColor = dark ? '#1a1a1a' : '';
        document.body.style.color = dark ? '#fff' : '';
      }
      localStorage.setItem('theme', mode);
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) setBg(savedTheme);

    init();
  </script>
</body>

</html>
